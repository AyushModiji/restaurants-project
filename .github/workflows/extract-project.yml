
name: Extract restaurant project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract source archive
        run: |
          test -f restaurant-platform-full-source.zip
          mkdir extracted
          unzip -o restaurant-platform-full-source.zip -d extracted
          cp -R extracted/. .
          rm -rf extracted
          rm restaurant-platform-full-source.zip

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract restaurant platform source"
          git push
